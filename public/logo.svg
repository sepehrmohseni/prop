<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Diamond shape behind the P — represents value/assets -->
  <path d="M256 88 L368 216 L256 344 L144 216 Z" fill="url(#accent)" opacity="0.15"/>
  <path d="M256 88 L368 216 L256 344 L144 216 Z" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.4"/>

  <!-- Stylized P letterform -->
  <g fill="url(#glow)">
    <!-- Vertical stem -->
    <rect x="168" y="128" width="40" height="272" rx="6"/>
    <!-- Bowl of P -->
    <path d="M188 128 h80 a72 72 0 0 1 0 144 h-80 v-40 h76 a32 32 0 0 0 0-64 h-76 z"/>
  </g>

  <!-- Small diamond accent dot -->
  <rect x="240" y="356" width="16" height="16" rx="2" transform="rotate(45 248 364)" fill="url(#accent)"/>
</svg>
